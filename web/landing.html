<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batavia, IL</title>
<link rel="icon" type="image/svg+xml" href="favicon-bataviail-ai.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  /* Tokens are set from themes.js at render time; these are neutral defaults
     so the shell doesn't flash unstyled while the entity loads. */
  :root{
    --bg:#f4f5f8; --surface:#fff; --ink:#1c2030; --muted:#7E7F81; --line:#e7e9f0;
    --accent:#292F7B; --accent2:#00ADEF;
    --tint:rgba(41,47,123,.08); --lineA:rgba(41,47,123,.28);
    --fd:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --fb:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --radius:14px; --maxw:960px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 var(--fb);-webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  img{max-width:100%}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}

  /* ── Topbar ─────────────────────────────────────── */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;transition:.25s}
  .topbar a{color:#fff;text-decoration:none;font-weight:600;font-size:14px;background:rgba(0,0,0,.32);padding:7px 14px;border-radius:999px;backdrop-filter:blur(6px)}
  .topbar.solid{background:var(--surface);box-shadow:0 1px 10px rgba(0,0,0,.14)}
  .topbar.solid a{color:var(--ink);background:var(--tint)}

  /* ── Hero: immersive (profile · warm) ───────────── */
  .hero-imm{position:relative;min-height:64vh;display:flex;align-items:flex-end;background:#222}
  .hero-imm .hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero-imm::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.06) 30%,rgba(0,0,0,.58) 100%)}
  .hero-imm .inner{position:relative;z-index:2;max-width:var(--maxw);margin:0 auto;width:100%;padding:0 24px 40px;color:#fff}
  .hero-imm h1{margin:0 0 10px;font-family:var(--fd);font-size:clamp(32px,5.4vw,54px);line-height:1.06;letter-spacing:-.5px;text-shadow:0 2px 20px rgba(0,0,0,.4)}
  .hero-imm.noimg{min-height:44vh;background:linear-gradient(130deg,var(--accent),var(--accent2))}
  .hero-imm.noimg::after{display:none}
  .elogo{width:64px;height:64px;border-radius:14px;background:#fff;padding:7px;object-fit:contain;box-shadow:0 6px 20px rgba(0,0,0,.28);margin-bottom:14px;display:block}
  .kickers{display:flex;gap:8px;flex-wrap:wrap}
  .kicker{font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.92);color:#222;font-family:var(--fb)}
  .kicker.brand{background:var(--accent);color:#fff}
  .thumbs{position:absolute;right:18px;bottom:18px;z-index:3;display:flex;gap:7px}
  .thumb{width:54px;height:40px;border-radius:7px;object-fit:cover;cursor:pointer;border:2px solid rgba(255,255,255,.7)}
  .thumb.active{border-color:var(--accent2)}

  /* ── Hero: poster (bold) ────────────────────────── */
  .hero-poster{position:relative;min-height:78vh;display:flex;align-items:flex-end;overflow:hidden;background:var(--bg)}
  .hero-poster .hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(35%) contrast(1.08) brightness(.62)}
  .hero-poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,23,27,.15) 0%,rgba(22,23,27,.55) 60%,var(--bg) 99%)}
  .hero-poster .inner{position:relative;z-index:2;max-width:var(--maxw);margin:0 auto;width:100%;padding:120px 24px 20px}
  .hero-poster .kick{font:600 13px/1 var(--fb);letter-spacing:.34em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
  .hero-poster h1{margin:0;font-family:var(--fd);font-weight:400;font-size:clamp(64px,13vw,150px);line-height:.88;text-transform:uppercase;color:var(--ink)}
  .hero-poster .rule{width:110px;height:7px;background:var(--accent);margin:26px 0 8px}
  .hero-poster.noimg{min-height:56vh}
  .hero-poster.noimg::after{background:repeating-linear-gradient(-45deg,transparent 0 26px,rgba(224,163,46,.06) 26px 52px)}

  /* ── Hero: editorial (civic) ────────────────────── */
  .hero-ed{padding:110px 0 56px}
  .hero-ed .cols{max-width:var(--maxw);margin:0 auto;padding:0 24px;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
  .hero-ed .kick{font:600 12px/1 var(--fb);letter-spacing:.3em;text-transform:uppercase;color:var(--accent2);margin:0 0 18px}
  .hero-ed h1{margin:0 0 18px;font-family:var(--fd);font-weight:600;font-size:clamp(38px,6vw,68px);line-height:1.04;letter-spacing:-.02em}
  .hero-ed .lede{font-size:1.14rem;color:var(--muted);margin:0 0 20px;max-width:52ch}
  .hero-ed .addr{font-size:.92rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
  .hero-ed .photo{position:relative}
  .hero-ed .photo img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;position:relative;z-index:1}
  .hero-ed .photo::after{content:"";position:absolute;inset:0;transform:translate(16px,16px);border:2px solid var(--accent);z-index:0}
  .hero-ed .elogo{box-shadow:none;border:1px solid var(--line);padding:9px}

  /* ── Hero: fullbleed (bespoke) ──────────────────── */
  .hero-fb{position:relative;min-height:92vh;display:flex;align-items:center;justify-content:center;text-align:center;background:#0a0c12}
  .hero-fb .hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
  .hero-fb::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 62%,rgba(10,12,18,.1) 0%,rgba(10,12,18,.78) 100%)}
  .hero-fb .inner{position:relative;z-index:2;padding:0 24px;max-width:920px}
  .hero-fb .eyebrow{font-family:var(--fd);font-style:italic;font-size:clamp(19px,2.6vw,26px);color:var(--accent);margin:0 0 16px}
  .hero-fb h1{margin:0 0 26px;font-family:var(--fd);font-weight:400;font-size:clamp(48px,8.5vw,110px);line-height:1;letter-spacing:-.01em;color:#fff}
  .hero-fb .kickers{justify-content:center}
  .hero-fb .cue{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:2;color:rgba(255,255,255,.65);font-size:12px;letter-spacing:.28em;text-transform:uppercase;animation:cue 2.4s ease-in-out infinite}
  @keyframes cue{0%,100%{transform:translate(-50%,0);opacity:.65}50%{transform:translate(-50%,8px);opacity:1}}

  /* ── Content skeleton ───────────────────────────── */
  main{padding:20px 0 70px}
  section.sec{max-width:var(--maxw);margin:0 auto;padding:44px 24px;opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
  section.sec.in{opacity:1;transform:none}
  section.sec + section.sec{border-top:1px solid var(--line)}
  .sec h2{font-family:var(--fd);font-size:15px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);margin:0 0 18px;font-weight:800}
  .about{font-size:20px;line-height:1.65;margin:0;max-width:66ch}

  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{font-size:14px;background:var(--tint);border:1px solid var(--lineA);color:var(--ink);border-radius:var(--radius);padding:7px 13px}
  .svc-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
  .svc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;font-weight:600;font-size:15px;display:flex;gap:12px;align-items:baseline}
  .svc-card .n{font-family:var(--fd);color:var(--accent);font-size:1.15em}

  .ev{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
  .ev:last-child{border-bottom:0}
  .ev .date{flex:0 0 80px;color:var(--accent);font-weight:700;font-size:14px;line-height:1.3;font-family:var(--fb)}
  .ev .t{font-weight:600}.ev .m{font-size:14px;color:var(--muted)}

  table.hours{border-collapse:collapse;font-size:15px}
  table.hours td{padding:4px 24px 4px 0}
  table.hours td:first-child{font-weight:700;color:var(--muted)}

  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .contact-grid .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .btn{display:inline-block;text-decoration:none;font-weight:600;font-size:14px;padding:10px 18px;border-radius:var(--radius)}
  .btn.primary{background:var(--accent);color:var(--btn-ink,#fff)}
  .btn.ghost{background:var(--tint);color:var(--ink);border:1px solid var(--lineA)}

  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .gallery figure{margin:0}
  .gallery img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:var(--radius);display:block}
  .gallery figcaption{font-size:12.5px;color:var(--muted);padding:6px 2px 0}

  /* stats band + pull quote + CTA (bespoke sections, themable by any) */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;text-align:center}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 14px}
  .stat .n{font-family:var(--fd);font-size:52px;line-height:1;color:var(--accent)}
  .stat .l{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:10px}
  .pull{max-width:820px;margin:0 auto;text-align:center}
  .pull blockquote{margin:0;font-family:var(--fd);font-size:clamp(24px,3.6vw,36px);line-height:1.3;font-style:italic;color:var(--ink)}
  .pull .mark{color:var(--accent);font-size:1.4em;line-height:0;vertical-align:-.12em}
  .cta-panel{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--radius) + 6px);padding:52px 30px;text-align:center}
  .cta-panel h3{font-family:var(--fd);font-weight:400;font-size:clamp(28px,4.4vw,44px);margin:0 0 10px;line-height:1.1}
  .cta-panel p{color:var(--muted);margin:0 0 24px}
  .cta-panel .btns{justify-content:center;margin-top:0}

  .foot{max-width:var(--maxw);margin:0 auto;padding:26px 24px 110px;text-align:center;color:var(--muted);font-size:14px}
  .foot a{color:var(--accent)}

  /* ── Demo / tier switcher bar ───────────────────── */
  .demobar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:4px;
    background:rgba(16,18,28,.92);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 6px;
    font:600 12.5px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .demobar .dlabel{color:rgba(255,255,255,.45);padding:0 8px 0 10px;letter-spacing:.08em;text-transform:uppercase;font-size:10.5px}
  .demobar a{color:rgba(255,255,255,.75);text-decoration:none;padding:8px 13px;border-radius:999px;white-space:nowrap}
  .demobar a:hover{color:#fff}
  .demobar a.on{background:#fff;color:#14161f}
  .demobar a.on .tier{color:#5b6478}
  .demobar .tier{font-size:9.5px;color:rgba(255,255,255,.4);display:block;letter-spacing:.06em;margin-top:3px;text-transform:uppercase}
  .demobar .close{color:rgba(255,255,255,.5);padding:8px 11px;cursor:pointer;border-radius:999px}
  .demobar .close:hover{color:#fff}
  @media(max-width:700px){.demobar{max-width:calc(100vw - 20px);overflow-x:auto}.demobar .dlabel{display:none}}

  /* ── Bespoke PAGE blocks (entity_pages layout_json) ── */
  .phero{position:relative;min-height:88vh;display:flex;align-items:flex-end;background:#1a1a17}
  .phero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .phero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,19,16,.12) 25%,rgba(20,19,16,.78) 100%)}
  .phero .inner{position:relative;z-index:2;max-width:1080px;margin:0 auto;width:100%;padding:120px 28px 66px;color:#fff}
  .phero .peyebrow{font:600 13px/1 var(--fb);letter-spacing:.3em;text-transform:uppercase;color:var(--ab);margin:0 0 16px}
  .phero h1{margin:0 0 18px;font-family:var(--fd);font-weight:var(--hw,800);font-size:clamp(46px,7.2vw,92px);line-height:.98;letter-spacing:var(--ht,-.015em)}
  .phero .ptag{font-family:var(--fa,var(--fd));font-size:clamp(18px,2.4vw,25px);line-height:1.45;color:rgba(255,255,255,.88);max-width:52ch;margin:0 0 26px}
  .phero .btns{margin-top:0}
  .phero .btn.primary{background:var(--ab);color:#242323}
  .phero .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(4px)}
  .phero .elogo{box-shadow:0 6px 24px rgba(0,0,0,.4)}

  .pkick{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
  .pkick .pk1{font-family:var(--fa,var(--fd));font-size:22px;color:var(--accent);text-transform:lowercase}
  .pkick .pk2{font:800 13.5px/1 var(--fb);letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
  .pkick::after{content:"";flex:0 0 46px;height:3px;background:var(--ab);border-radius:2px;align-self:center}

  .psplit{display:grid;grid-template-columns:1.04fr .96fr;gap:54px;align-items:center}
  .psplit .txt h3{font-family:var(--fd);font-weight:var(--hw,800);font-size:clamp(26px,3.6vw,40px);line-height:1.08;letter-spacing:var(--ht,-.015em);margin:6px 0 16px;color:var(--ink)}
  .psplit .txt p{font-size:17.5px;line-height:1.75;color:var(--ink);margin:0 0 14px}
  .psplit figure{margin:0}
  .psplit img{width:100%;aspect-ratio:4/3.1;object-fit:cover;border-radius:14px;box-shadow:0 16px 44px rgba(36,35,35,.18)}
  .psplit figcaption{font-size:13px;color:var(--muted);padding:9px 4px 0}
  .psplit.rev figure{order:-1}
  .pbullets{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:9px}
  .pbullets li{padding-left:26px;position:relative;font-weight:600;font-size:15.5px}
  .pbullets li::before{content:"";position:absolute;left:0;top:.52em;width:14px;height:3px;background:var(--ab);border-radius:2px}

  .pquote{max-width:860px;margin:0 auto;text-align:center;padding:10px 0}
  .pquote blockquote{margin:0;font-family:var(--fa,var(--fd));font-size:clamp(26px,4vw,42px);line-height:1.3;color:var(--ink)}
  .pquote .mark{color:var(--ab);font-size:1.5em;line-height:0;vertical-align:-.14em}
  .pquote cite{display:block;margin-top:18px;font:600 12.5px/1 var(--fb);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-style:normal}

  .pteam{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:18px}
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 22px;text-align:center}
  .pcard .mono{width:56px;height:56px;border-radius:50%;background:var(--ab);color:#242323;font:700 22px/56px var(--fa,var(--fd));margin:0 auto 14px}
  .pcard .face{width:116px;height:116px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 16px;
    border:3px solid var(--ab);box-shadow:0 8px 22px rgba(36,35,35,.18)}
  .pcard b{display:block;font-size:16.5px}
  .pcard span{font-size:13px;color:var(--muted);letter-spacing:.04em}

  .pvisit{display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:start}
  .pvisit h3{font-family:var(--fd);font-weight:var(--hw,800);font-size:clamp(26px,3.6vw,40px);line-height:1.08;letter-spacing:var(--ht,-.015em);margin:6px 0 14px}
  .pvisit .note{font-size:17px;line-height:1.7;color:var(--ink);margin:0 0 20px}
  .pvisit .hcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 28px}
  .pvisit .hcard .hl{font:800 12.5px/1 var(--fb);letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
  .ph3{font-family:var(--fd);font-weight:var(--hw,800);font-size:clamp(26px,3.6vw,40px);line-height:1.08;letter-spacing:var(--ht,-.015em);margin:6px 0 4px;color:var(--ink)}
  .pevents{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px;margin-top:20px}
  .pev{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 20px 18px;border-top:4px solid var(--ab)}
  .pev .d{font-family:var(--fa,var(--fd));color:var(--accent);font-size:18px;margin:0 0 8px}
  .pev b{display:block;font-size:16px;margin-bottom:5px}
  .pev p{font-size:13.5px;color:var(--muted);margin:0;line-height:1.55}
  .pev .meta{margin-top:8px;font:600 12px/1 var(--fb);letter-spacing:.06em;color:var(--accent2)}
  .pev.haspic{position:relative;overflow:hidden;padding:0;min-height:235px;display:flex;align-items:flex-end;background:#17150f}
  .pev.haspic .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
  .pev.haspic:hover .bg{transform:scale(1.06)}
  .pev.haspic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,12,.22) 0%,rgba(20,18,12,.5) 52%,rgba(20,18,12,.94) 100%)}
  .pev.haspic .txt{position:relative;z-index:2;padding:18px 18px 16px;text-shadow:0 1px 10px rgba(0,0,0,.6)}
  .pev.haspic b{color:#fff}
  .pev.haspic .d{color:var(--ab)}
  .pev.haspic p{color:rgba(255,255,255,.78)}
  .pev.haspic .meta{color:rgba(255,255,255,.9)}
  .pevents-foot{margin-top:18px}
  /* video story carousel (Tier-3 "ultimate" block) */
  .vwrap{position:relative;margin-top:20px}
  .vtrack{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 12px;scrollbar-width:thin}
  .vcard{flex:0 0 234px;scroll-snap-align:start}
  .vcard video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:16px;background:#101010;display:block;box-shadow:0 10px 26px rgba(20,18,12,.18)}
  .vcard p{font:600 14px/1.4 var(--fb);margin:9px 2px 0;color:var(--ink)}
  .vmedia{position:relative}
  .vplay{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(255,255,255,.93);color:#1c1a16;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 22px rgba(0,0,0,.38);transition:.2s;z-index:2}
  .vplay svg{width:24px;height:24px;fill:currentColor;margin-left:3px}
  .vplay:hover{background:var(--ab);transform:scale(1.07)}
  .vmedia.playing .vplay{opacity:0;pointer-events:none}
  .vnav{position:absolute;top:44%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;z-index:3;box-shadow:0 4px 14px rgba(20,18,12,.18)}
  .vnav.prev{left:-10px}.vnav.next{right:-10px}
  .vnav:hover{background:var(--accent);color:var(--btn-ink,#fff)}
  @media(max-width:700px){.vnav{display:none}}
  .socials{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
  .socialbtn{width:54px;height:54px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    background:var(--tint);color:var(--accent);border:1px solid var(--lineA);transition:.2s}
  .socialbtn svg{width:26px;height:26px;fill:currentColor}
  .socialbtn:hover{background:var(--accent);color:var(--btn-ink,#fff);transform:translateY(-2px)}
  body[data-page] .gallery{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  body[data-page] .topbar a{background:rgba(0,0,0,.34)}
  body[data-page] .topbar.solid a{background:var(--tint);color:var(--ink)}
  @media(max-width:760px){.psplit,.pvisit{grid-template-columns:1fr;gap:26px}.psplit.rev figure{order:0}}

  /* ═══ Theme personalities ═══════════════════════ */

  /* bold — sharp, condensed, industrial */
  body[data-theme=bold]{--radius:2px}
  body[data-theme=bold] .sec h2{font-size:30px;font-weight:400;letter-spacing:.05em;padding-left:16px;border-left:7px solid var(--accent)}
  body[data-theme=bold] .about{font-size:19px}

};
const socialIcons=list=>(list||[]).map(s=>{
  const d=PLAT_ICONS[s.platform];
  return d?`<a class="socialbtn" href="${esc(s.url)}" target="_blank" rel="noopener" aria-label="${esc(plat(s.platform))}" title="${esc(plat(s.platform))}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg></a>`
          :`<a class="btn ghost" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(plat(s.platform))}</a>`;
}).join("");
const lum=h=>{const[r,g,b]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);return .2126*r+.7152*g+.0722*b};
const hex=h=>h&&/^#[0-9a-f]{6}$/i.test(h)?h:null;
const evd=s=>{if(!s)return{d:"Date TBD",m:""};const dt=new Date(s);if(isNaN(dt))return{d:"Date TBD",m:""};
  const ht=!/T00:00/.test(s);return{d:`${DAYS[dt.getDay()]}<br>${MON[dt.getMonth()]} ${dt.getDate()}`,m:ht?dt.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):""}};

const params=new URLSearchParams(location.search);
const id=params.get("id");
if(!id){document.getElementById("page").innerHTML="<p style='padding:80px 24px'>No entity specified. <a href='index.html'>← Back</a></p>";}
else load();

async function load(){
  const sel="name,membership_level,website,summary,categories,services,hours,social,contacts,events,brand,hero,media,location,verification_status,logo_url";
  let e;
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/entity_full?id=eq.${id}&select=${sel}`,{headers:{apikey:ANON_KEY,Authorization:"Bearer "+ANON_KEY}});
    e=(await r.json())[0];
  }catch(err){}
  if(!e){document.getElementById("page").innerHTML="<p style='padding:80px 24px'>Not found. <a href='index.html'>← Back</a></p>";return;}
  document.title=e.name+" — Batavia, IL";
  const key=window.THEMES[params.get("theme")]?params.get("theme"):window.pickTheme(e);
  // Tier 3: a published entity_pages spec upgrades "bespoke" from the generic
  // pro theme to this entity's own authored page (custom copy, palette, blocks).
  let page=null;
  if(key==="bespoke"){
    try{
      const r=await fetch(`${SUPABASE_URL}/rest/v1/entity_pages?entity_id=eq.${id}&published=is.true&order=version.desc&limit=1&select=layout_json`,

      page=((await r.json())[0]||{}).layout_json||null;
      if(page&&!Array.isArray(page.blocks))page=null;
    }catch(err){}
  }
  render(e,key,page);
}

/* ── Theme application ────────────────────────────── */
function applyTheme(t,e,pb){ // pb = per-page brand overrides from entity_pages.layout_json
  const b=e.brand||{}, root=document.documentElement.style;
  const tok=Object.assign({},t.tokens);
  if(t.useBrand){
    const p=hex(b.primary), a=hex(b.accent);
    if(t.dark){ // dark themes need a bright accent: prefer whichever brand color reads on near-black
      const cand=[a,p].filter(c=>c&&lum(c)>.32)[0];
      if(cand)tok.accent=cand;
    }else{
      if(p&&lum(p)<.72)tok.accent=p;
      if(a)tok.accent2=a;
    }
  }
  if(pb)["bg","surface","ink","muted","line","accent","accent2"].forEach(k=>{if(hex(pb[k]))tok[k]=pb[k]});
  for(const[k,v]of Object.entries({bg:tok.bg,surface:tok.surface,ink:tok.ink,muted:tok.muted,line:tok.line,accent:tok.accent,accent2:tok.accent2}))
    root.setProperty("--"+k,v);
  const darkBg=lum(tok.bg||"#ffffff")<.4;
  root.setProperty("--tint",tok.accent+(darkBg?"22":"14"));
  root.setProperty("--lineA",tok.accent+"40");
  root.setProperty("--btn-ink",lum(tok.accent)>.55?"#14161f":"#fff");
  root.setProperty("--ab",(pb&&hex(pb.accentBright))||tok.accent); // bright accent for graphic uses on photos/dark
  // fonts: theme pairing; profile adopts the entity heading font; page brand wins outright
  let fd=t.fonts.display, fb=t.fonts.body;
  let gf=t.fonts.google.slice();
  if(t.key==="profile"&&b.font_heading){fd=`'${b.font_heading}',Georgia,serif`;gf.push(encodeURIComponent(b.font_heading).replace(/%20/g,"+"));}
  if(pb){
    if(pb.fontDisplay)fd=`'${pb.fontDisplay}',Georgia,serif`;
    if(pb.fontBody)fb=`'${pb.fontBody}',-apple-system,sans-serif`;
    if(Array.isArray(pb.google)&&pb.google.length)gf=pb.google.slice();
  }
  root.setProperty("--fd",fd);root.setProperty("--fb",fb);
  root.setProperty("--fa",(pb&&pb.fontAccent)?`'${pb.fontAccent}',Georgia,serif`:fd);
  // heading voice knobs: single-weight display faces (Bebas etc.) need 400 + positive tracking
  if(pb&&pb.headingWeight)root.setProperty("--hw",pb.headingWeight);
  if(pb&&pb.headingTracking)root.setProperty("--ht",pb.headingTracking);
  if(gf.length){const l=document.createElement("link");l.rel="stylesheet";
    l.href=`https://fonts.googleapis.com/css2?${gf.map(f=>"family="+f).join("&")}&display=swap`;document.head.appendChild(l);}
  document.body.dataset.theme=t.key;
  if(pb)document.body.dataset.page="1";
}

/* ── Section library ──────────────────────────────── */
const SECTIONS={
  about:(e,t)=>e.summary?sec("About",`<p class="about">${esc(e.summary)}</p>`):"",
  services(e,t){
    const s=e.services||[];if(!s.length)return"";
    const body=t.servicesStyle==="cards"
      ?`<div class="svc-cards">${s.map((x,i)=>`<div class="svc-card"><span class="n">${String(i+1).padStart(2,"0")}</span>${esc(x)}</div>`).join("")}</div>`
      :`<div class="chips">${s.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`;
    return sec("Products & Services",body);
  },
  events(e,t){
    const ev=(e.events||[]).map(x=>{const f=evd(x.starts_at);
      const price=x.price&&!/unknown|n\/a|tbd/i.test(x.price)?x.price:"";
      const meta=[f.m,x.location,price].filter(Boolean).map(esc).join(" · ");
      return `<div class="ev"><div class="date">${f.d}</div><div><div class="t">${esc(x.title)}</div>${x.description?`<div class="m">${esc(x.description)}</div>`:""}${meta?`<div class="m">${meta}</div>`:""}</div></div>`}).join("");
    return ev?sec("Upcoming Events",ev):"";
  },
  hours(e,t){
    const h=(e.hours||[]).slice().sort((x,y)=>x.day_of_week-y.day_of_week)
      .map(x=>`<tr><td>${DAYS[x.day_of_week]}</td><td>${esc(fmtT(x.opens))} – ${esc(fmtT(x.closes))}</td></tr>`).join("");
    return h?sec("Hours",`<table class="hours">${h}</table>`):"";
  },
  contact(e,t){
    const loc=locLine(e);
    const contacts=(e.contacts||[]).map(c=>{const who=[c.name,c.title].filter(Boolean).map(esc).join(" · ");const bits=[];
      if(c.phone)bits.push(esc(c.phone));if(c.email)bits.push(`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`);
      return who||bits.length?`<div>${who?`<b>${who}</b><br>`:""}${bits.join(" · ")}</div>`:""}).join("");
    return sec("Contact & Location",`<div class="contact-grid">
        ${loc?`<div><div class="lbl">Address</div><a href="https://maps.google.com/?q=${encodeURIComponent(loc)}" target="_blank" rel="noopener">${esc(loc)}</a></div>`:""}
        ${contacts?`<div><div class="lbl">Reach out</div>${contacts}</div>`:""}</div>
      <div class="btns">${e.website?`<a class="btn primary" href="${esc(e.website.trim())}" target="_blank" rel="noopener">Visit website ↗</a>`:""}</div>
      ${(e.social||[]).length?`<div class="socials">${socialIcons(e.social)}</div>`:""}`);
  },
  gallery(e,t){
    const m=(e.media||[]).length>1?e.media:[];if(!m.length)return"";
    return sec("Gallery",`<div class="gallery">${m.map(x=>`<figure><img src="${esc(x.url)}" loading="lazy" alt="${esc(x.caption||"")}">${x.caption?`<figcaption>${esc(x.caption)}</figcaption>`:""}</figure>`).join("")}</div>`);
  },
  stats(e,t){ // derived from real data; band renders only when ≥2 stats exist
    const up=(e.events||[]).filter(x=>x.starts_at&&new Date(x.starts_at)>new Date()).length;
    const st=[
      {n:(e.services||[]).length,l:"Services"},
      {n:(e.media||[]).length>1?e.media.length:0,l:"Photos"},
      {n:up,l:"Upcoming events"},
      {n:(e.hours||[]).length,l:"Days open / week"},
    ].filter(s=>s.n>0).slice(0,4);
    if(st.length<2)return"";
    return sec("",`<div class="stats">${st.map(s=>`<div class="stat"><div class="n">${s.n}</div><div class="l">${esc(s.l)}</div></div>`).join("")}`+"</div>");
  },
  quote(e,t){
    const q=firstSentence(e.summary||"");if(q.length<40)return"";
    return sec("",`<div class="pull"><blockquote><span class="mark">“</span>${esc(q)}<span class="mark">”</span></blockquote></div>`);
  },
  cta(e,t){
    const loc=locLine(e), tel=((e.contacts||[]).find(c=>c.phone)||{}).phone;
    const btns=[
      e.website?`<a class="btn primary" href="${esc(e.website.trim())}" target="_blank" rel="noopener">Visit website ↗</a>`:"",
      tel?`<a class="btn ghost" href="tel:${esc(tel.replace(/[^\d+]/g,""))}">Call ${esc(tel)}</a>`:"",

/* ── Tier-3 block library (entity_pages.layout_json.blocks) ──
 * Authored/agent content renders through these; unknown types are skipped so
 * old pages survive new engines and vice versa. */
const kick=k=>Array.isArray(k)&&k.length?`<div class="pkick"><span class="pk1">${esc(k[0])}</span><span class="pk2">${esc(k.slice(1).join(" "))}</span></div>`:"";
const BLOCKS={
  hero(b,e){
    const ctas=(b.ctas||[]).map(c=>`<a class="btn ${c.primary?"primary":"ghost"}" href="${esc(c.href)}"${/^https?:/.test(c.href||"")?' target="_blank" rel="noopener"':""}>${esc(c.label)}</a>`).join("");
    return `<div class="phero">${b.image?`<img class="bg" src="${esc(b.image)}" alt="">`:""}
      <div class="inner">${logoTag(e)}${b.eyebrow?`<p class="peyebrow">${esc(b.eyebrow)}</p>`:""}
        <h1>${esc(b.title||e.name)}</h1>
        ${b.tagline?`<p class="ptag">${esc(b.tagline)}</p>`:""}
        ${ctas?`<div class="btns">${ctas}</div>`:""}</div></div>`;
  },
  facts(b){
    const items=(b.items||[]).slice(0,4);if(!items.length)return"";
    return sec("",`<div class="stats">${items.map(s=>`<div class="stat"><div class="n">${esc(s.n)}</div><div class="l">${esc(s.l)}</div></div>`).join("")}</div>`);
  },
  story(b,e){return BLOCKS.split(Object.assign({align:"right"},b),e)},
  split(b){
    const paras=(b.body||[]).map(p=>`<p>${esc(p)}</p>`).join("");
    const bullets=(b.bullets||[]).length?`<ul class="pbullets">${b.bullets.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
    const fig=b.image?`<figure><img src="${esc(b.image)}" loading="lazy" alt="${esc(b.caption||"")}">${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:""}</figure>`:"";
    return sec("",`<div class="psplit${b.align==="left"?" rev":""}">
        <div class="txt">${kick(b.kicker)}${b.heading?`<h3>${esc(b.heading)}</h3>`:""}${paras}${bullets}</div>${fig}</div>`);
  },
  quote(b){
    if(!b.text)return"";
    return sec("",`<div class="pquote"><blockquote><span class="mark">“</span>${esc(b.text)}<span class="mark">”</span></blockquote>${b.cite?`<cite>— ${esc(b.cite)}</cite>`:""}</div>`);
  },
  team(b){
    const ppl=(b.people||[]);if(!ppl.length)return"";
    const cards=ppl.map(p=>{
      const face=p.photo?`<img class="face" src="${esc(p.photo)}" alt="${esc(p.name||"")}" loading="lazy">`
                        :`<div class="mono">${esc((p.name||"?")[0])}</div>`;
      return `<div class="pcard">${face}<b>${esc(p.name)}</b><span>${esc(p.role||"")}</span></div>`}).join("");
    return sec("",`${kick(b.kicker)}<div class="pteam">${cards}</div>`);
  },
  gallery(b){
    const imgs=(b.images||[]);if(!imgs.length)return"";
    return sec("",`${kick(b.kicker)}<div class="gallery">${imgs.map(m=>`<figure><img src="${esc(m.url)}" loading="lazy" alt="${esc(m.caption||"")}">${m.caption?`<figcaption>${esc(m.caption)}</figcaption>`:""}</figure>`).join("")}</div>`);
  },
  events(b,e){ // live from entity data: upcoming first, so the page stays fresh without republishing
    const cutoff=Date.now()-864e5;
    const list=(e.events||[]).filter(x=>x.starts_at&&new Date(x.starts_at).getTime()>cutoff)
      .sort((a,c)=>new Date(a.starts_at)-new Date(c.starts_at)).slice(0,b.limit||6);
    if(!list.length)return"";
    // Spec-authored keyword rules pick a close-up background per event; a
    // future photo_uploads kind="event" assignment will override these.
    const pickImg=x=>{
      const hay=((x.title||"")+" "+(x.description||"")).toLowerCase();
      for(const r of (b.imageRules||[]))if((r.match||[]).some(k=>hay.indexOf(k)!==-1))return r.url;
      return b.imageDefault||"";
    };
    const cards=list.map(x=>{
      const dt=new Date(x.starts_at), f=evd(x.starts_at);
      const when=`${DAYS[dt.getDay()]}, ${MON[dt.getMonth()]} ${dt.getDate()}`+(f.m?` · ${f.m}`:"");
      const okPrice=x.price&&x.price!=="Free"&&!/unknown|n\/a|tbd/i.test(x.price);
      const meta=[okPrice?x.price:"",x.url?"Tickets available":""].filter(Boolean).join(" · ");
      const img=pickImg(x);
      const txt=`<p class="d">${esc(when)}</p><b>${esc(x.title)}</b>
        ${x.description?`<p>${esc(x.description)}</p>`:""}${meta?`<div class="meta">${esc(meta)}</div>`:""}`;
      return img?`<div class="pev haspic"><img class="bg" src="${esc(img)}" alt="" loading="lazy"><div class="txt">${txt}</div></div>`
                :`<div class="pev">${txt}</div>`;
    }).join("");
    const more=b.moreHref?`<div class="btns pevents-foot"><a class="btn ghost" href="${esc(b.moreHref)}" target="_blank" rel="noopener">${esc(b.moreLabel||"Full calendar ↗")}</a></div>`:"";
    return sec("",`${kick(b.kicker)}${b.heading?`<h3 class="ph3">${esc(b.heading)}</h3>`:""}<div class="pevents">${cards}</div>${more}`);
  },
  videos(b){ // horizontal story-reel carousel; videos lazy (preload=none), posters carry the load
    const items=(b.items||[]);if(!items.length)return"";
    const cards=items.map(v=>`<div class="vcard"><div class="vmedia">
        <video preload="none" playsinline poster="${esc(v.poster||"")}" src="${esc(v.src)}"></video>
        <button class="vplay" aria-label="Play ${esc(v.title||"video")}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button></div>
        <p>${esc(v.title||"")}</p></div>`).join("");
    return sec("",`${kick(b.kicker)}${b.heading?`<h3 class="ph3">${esc(b.heading)}</h3>`:""}
      <div class="vwrap"><button class="vnav prev" aria-label="Scroll back">‹</button>
      <div class="vtrack">${cards}</div><button class="vnav next" aria-label="Scroll forward">›</button></div>`);
  },
  visit(b,e){
    const loc=locLine(e), tel=((e.contacts||[]).find(c=>c.phone)||{}).phone;
    const hours=(e.hours||[]).slice().sort((x,y)=>x.day_of_week-y.day_of_week)
      .map(x=>`<tr><td>${DAYS[x.day_of_week]}</td><td>${esc(fmtT(x.opens))} – ${esc(fmtT(x.closes))}</td></tr>`).join("");
    const btns=[
      e.website?`<a class="btn primary" href="${esc(e.website.trim())}" target="_blank" rel="noopener">Visit website ↗</a>`:"",
      tel?`<a class="btn ghost" href="tel:${esc(tel.replace(/[^\d+]/g,""))}">Call ${esc(tel)}</a>`:"",
      loc?`<a class="btn ghost" href="https://maps.google.com/?q=${encodeURIComponent(loc)}" target="_blank" rel="noopener">Get directions</a>`:"",
    ].filter(Boolean).join("");
    return `<section class="sec" id="visit"><div class="pvisit">
        <div>${kick(b.kicker)}${b.heading?`<h3>${esc(b.heading)}</h3>`:""}
          ${b.note?`<p class="note">${esc(b.note)}</p>`:""}
          ${loc?`<p class="note" style="font-weight:600">${esc(loc)}</p>`:""}
          <div class="btns">${btns}</div>
          ${(e.social||[]).length?`<div class="socials">${socialIcons(e.social)}</div>`:""}</div>
        ${hours?`<div class="hcard"><p class="hl">Hours</p><table class="hours">${hours}</table></div>`:""}</div></section>`;
  },
};

/* ── Small shared bits ────────────────────────────── */
const sec=(label,body)=>`<section class="sec">${label?`<h2>${esc(label)}</h2>`:""}${body}</section>`;
const logoTag=e=>{const l=e.logo_url&&/res\.cloudinary\.com/i.test(e.logo_url)?e.logo_url:"";return l?`<img class="elogo" src="${esc(l)}" alt="">`:""};
const kickers=e=>`<div class="kickers">${e.membership_level&&e.membership_level!=="Unknown"?`<span class="kicker brand">${esc(e.membership_level)}</span>`:""}${(e.categories||[]).slice(0,3).map(c=>`<span class="kicker">${esc(c)}</span>`).join("")}</div>`;
const locLine=e=>e.location&&e.location.address?[e.location.address,e.location.city,e.location.state,e.location.zip].filter(Boolean).join(", "):"";
const firstSentence=s=>{const m=(s||"").match(/^.*?[.!?](?=\s|$)/);return m?m[0]:(s||"")};

/* ── Render ───────────────────────────────────────── */
function render(e,key,page){
  const t=window.themeByKey(key);
  applyTheme(t,e,page&&page.brand);

  document.getElementById("site-link").style.display=e.website?"inline-block":"none";
  if(e.website)document.getElementById("site-link").href=e.website.trim();

  let hero,body,foot="Part of the <a href=\"index.html\">Batavia community directory</a>";
  if(page){ // authored Tier-3 page: block spec replaces the theme's section order
    const blocks=page.blocks.map(b=>BLOCKS[b.type]?BLOCKS[b.type](b,e):"");
    hero=page.blocks[0]&&page.blocks[0].type==="hero"?blocks.shift():"";
    body=blocks.join("");
    foot="Bespoke Pro page · "+foot;
  }else{
    hero=HEROES[t.hero](e,t);
    body=t.sections.map(s=>SECTIONS[s]?SECTIONS[s](e,t):"").join("");
    foot+=" · "+esc(e.verification_status||"");
  }
  document.getElementById("page").innerHTML=`${hero}<main>${body}</main>
    <div class="foot">${foot}</div>`;

  // hero thumbnail swap (immersive only)
  document.querySelectorAll(".thumb").forEach(th=>th.addEventListener("click",()=>{
    document.getElementById("hero-bg").src=th.dataset.url;
    document.querySelectorAll(".thumb").forEach(x=>x.classList.remove("active"));th.classList.add("active");}));

  // topbar solidifies on scroll
  const tb=document.getElementById("topbar");
  addEventListener("scroll",()=>tb.classList.toggle("solid",scrollY>window.innerHeight*0.45));

  // staggered section reveals
  const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{rootMargin:"140px 0px",threshold:0});
  document.querySelectorAll("section.sec").forEach(s=>io.observe(s));

  // video carousel: arrow nav + only one video playing at a time
  document.querySelectorAll(".vwrap").forEach(w=>{
    const t=w.querySelector(".vtrack");
    w.querySelector(".prev").addEventListener("click",()=>t.scrollBy({left:-510,behavior:"smooth"}));
    w.querySelector(".next").addEventListener("click",()=>t.scrollBy({left:510,behavior:"smooth"}));
  });
  document.querySelectorAll(".vmedia").forEach(m=>{
    const v=m.querySelector("video"), b=m.querySelector(".vplay");
    b.addEventListener("click",()=>{v.setAttribute("controls","");v.play();});
    v.addEventListener("play",()=>{m.classList.add("playing");
      document.querySelectorAll(".vcard video").forEach(o=>{if(o!==v)o.pause()});
      window.logInteraction&&window.logInteraction("video_play",{entity_id:id,video:(v.currentSrc||"").split("/").pop()});});
    v.addEventListener("pause",()=>m.classList.remove("playing"));
    v.addEventListener("ended",()=>{m.classList.remove("playing");v.removeAttribute("controls");});
  });

  if(params.get("demo")!=="0")demoBar(key);
  window.logInteraction&&window.logInteraction("landing_view",{entity_id:id,theme:key});
}

/* Tier-ladder switcher: same entity through every theme. ?demo=0 hides it. */
function demoBar(current){
  const bar=document.createElement("div");bar.className="demobar";
  bar.innerHTML=`<span class="dlabel">Tiers</span>`+window.THEME_ORDER.map(k=>{
    const t=window.THEMES[k], u=new URL(location.href);u.searchParams.set("theme",k);
    return `<a href="${u.pathname+u.search}" class="${k===current?"on":""}">${t.label}<span class="tier">Tier ${t.tier}</span></a>`;
  }).join("")+`<span class="close" title="Hide">✕</span>`;
  bar.querySelector(".close").addEventListener("click",()=>bar.remove());
  document.body.appendChild(bar);
}
</script>
